<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>! crepuscolo</title>
  <meta name="description" content="! crepuscolo · Italy — C'est la vie" />
  <meta name="theme-color" content="#0b0709" />

  <!-- Open Graph / Discord Embed -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="! crepuscolo" />
  <meta property="og:description" content="Italy · C'est la vie — Capo Plaza" />
  <meta property="og:image" content="assets/avatar.jpg" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" type="image/jpeg" href="assets/avatar.jpg" />

  <!-- Clean Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body data-fx="twilight">
  <!-- Background Cinema Video & Audio-Reactive FX Layers -->
  <div class="bg-stage" aria-hidden="true">
    <video
      id="bg-video"
      class="bg-video"
      src="assets/videoclip.mp4"
      muted
      loop
      playsinline
      preload="auto"
    ></video>
    <div class="bg-aurora"></div>
    <div class="bg-vignette"></div>
    <div class="bg-beat-rim"></div>
    <div class="bg-grain"></div>
  </div>

  <!-- Interactive Particle, Stardust & Cursor Trail Canvas -->
  <canvas id="fx-canvas" class="fx-canvas" aria-hidden="true"></canvas>

  <!-- Hidden High-Quality Audio Engine -->
  <audio id="bg-audio" src="assets/song.mp3" loop preload="auto"></audio>

  <!-- Click-to-Enter Splash Overlay (guns.lol signature) -->
  <div id="enter-screen" class="enter-screen" role="button" tabindex="0" aria-label="Clicca per entrare">
    <div class="enter-orb" aria-hidden="true"></div>
    <div class="enter-content">
      <div class="enter-emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1.5L14.3 9.7L22.5 12L14.3 14.3L12 22.5L9.7 14.3L1.5 12L9.7 9.7L12 1.5Z" />
        </svg>
      </div>
      <p class="enter-prompt">
        <span class="enter-bracket">[</span>
        <span class="enter-text">click to enter</span>
        <span class="enter-bracket">]</span>
      </p>
      <div class="enter-track">
        <span class="enter-dot"></span>
        <span>Capo Plaza — C'est la vie</span>
      </div>
    </div>
  </div>

  <!-- Top Utility Bar -->
  <header class="top-bar">
    <div class="top-controls">
      <!-- Audio Volume Pill -->
      <div class="glass-pill volume-pill" id="volume-pill">
        <button
          type="button"
          id="mute-btn"
          class="icon-btn"
          aria-label="Attiva o disattiva audio"
          title="Audio"
        >
          <svg id="vol-icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <svg id="vol-icon-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
            <line x1="22" y1="9" x2="16" y2="15" />
            <line x1="16" y1="9" x2="22" y2="15" />
          </svg>
        </button>
        <div class="volume-slider-wrap">
          <input
            type="range"
            id="volume-slider"
            class="volume-slider"
            min="0"
            max="1"
            step="0.01"
            value="0.45"
            aria-label="Volume"
          />
        </div>
      </div>
    </div>

    <!-- Live Italy Clock Pill -->
    <div class="glass-pill clock-pill" title="Ora locale — Italy">
      <span class="live-dot" aria-hidden="true"></span>
      <span class="clock-region">IT</span>
      <span class="clock-sep" aria-hidden="true">·</span>
      <time id="italy-clock" class="clock-time">--:--</time>
    </div>
  </header>

  <!-- Main Centered Profile & Music Stage -->
  <main class="stage">
    <!-- Primary Profile Card -->
    <section id="profile-card" class="glass-card profile-card tilt-card" aria-label="Profilo personale">
      <div class="card-spotlight" aria-hidden="true"></div>
      <div class="card-top-glint" aria-hidden="true"></div>

      <!-- Avatar & Beat-Reactive Aura -->
      <div class="avatar-section">
        <div class="avatar-wrapper" id="avatar-wrapper" title="! crepuscolo">
          <div class="avatar-aura" aria-hidden="true"></div>
          <div class="avatar-ring" aria-hidden="true"></div>
          <div class="avatar-frame">
            <img id="profile-avatar" src="assets/avatar.jpg" alt="! crepuscolo" draggable="false" />
          </div>
          <div class="status-badge" id="status-badge" data-tooltip="crepuscolo · online">
            <span class="status-dot"></span>
          </div>
        </div>
      </div>

      <!-- Username with Floating guns.lol Sparkles -->
      <div class="identity-block">
        <div class="name-row">
          <h1 id="profile-name" class="profile-name">! crepuscolo</h1>
          <div id="name-sparkles" class="name-sparkles" aria-hidden="true"></div>
        </div>

        <!-- Typewriter Bio -->
        <p class="bio-line" aria-live="polite">
          <span id="bio-text"></span><span class="bio-caret" aria-hidden="true"></span>
        </p>

        <!-- Cohesive Badges Pill -->
        <div id="badges-row" class="badges-row" aria-label="Badge profilo"></div>

        <!-- Location & Views Meta -->
        <div class="meta-row">
          <span class="meta-item" title="Posizione">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
              <circle cx="12" cy="10" r="3" />
            </svg>
            <span id="profile-location">Italy</span>
          </span>
          <span class="meta-sep" aria-hidden="true">•</span>
          <span class="meta-item" title="Visite al profilo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <span id="view-count">1,337</span>
          </span>
        </div>
      </div>

      <!-- Compact Discord Presence Cards (auto-live via Lanyard) -->
      <div id="discord-list" class="discord-list" aria-label="Profili Discord"></div>

      <div class="card-divider" aria-hidden="true"></div>

      <!-- Social Links & Crypto Wallets -->
      <nav id="socials-row" class="socials-row" aria-label="Link social e wallet crypto"></nav>
    </section>

    <!-- Companion Audio-Reactive Music Player Card -->
    <section id="music-card" class="glass-card music-card tilt-card" aria-label="Lettore musicale">
      <div class="card-spotlight" aria-hidden="true"></div>

      <div class="music-cover-wrap">
        <img id="track-cover" src="assets/cover.jpg" alt="C'est la vie — Capo Plaza" draggable="false" />
        <div class="cover-sheen" aria-hidden="true"></div>
      </div>

      <div class="music-info">
        <div class="music-header">
          <div class="music-titles">
            <span id="track-title" class="track-title">C'est la vie</span>
            <span class="track-dash" aria-hidden="true">—</span>
            <span id="track-artist" class="track-artist">Capo Plaza</span>
          </div>

          <!-- Live FFT Audio Spectrum Bars -->
          <div id="visualizer" class="visualizer" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <div class="music-progress-row">
          <span id="time-current" class="time-label">0:00</span>
          <div
            id="progress-track"
            class="progress-track"
            role="slider"
            tabindex="0"
            aria-label="Progresso brano"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progress-fill" class="progress-fill">
              <span class="progress-thumb"></span>
            </div>
          </div>
          <span id="time-duration" class="time-label">3:06</span>
        </div>
      </div>

      <button
        type="button"
        id="play-pause-btn"
        class="play-btn"
        aria-label="Riproduci o metti in pausa"
        title="Play / Pausa"
      >
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l11.02-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z" />
        </svg>
        <svg id="icon-pause" class="hidden" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4.5" width="4.5" height="15" rx="1.4" />
          <rect x="13.5" y="4.5" width="4.5" height="15" rx="1.4" />
        </svg>
      </button>
    </section>
  </main>

  <!-- Floating Glass Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Custom Cute Matching Twilight Cursor -->
  <div id="cursor-ring" class="cursor-ring" aria-hidden="true">
    <span class="ring-glint ring-glint-a"></span>
    <span class="ring-glint ring-glint-b"></span>
  </div>
  <div id="cursor-core" class="cursor-core" aria-hidden="true">
    <svg class="cursor-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Dainty cute pointed charm cursor in warm pearl + crimson glow -->
      <path
        d="M5.2 3.6L21.4 13.9C22.4 14.5 22.1 16 20.9 16.3L14.2 17.8L11.4 24.1C10.9 25.2 9.3 25 9.1 23.8L4.2 4.9C4 4 4.5 3.1 5.2 3.6Z"
        fill="#FFF5F6"
        stroke="#B81D35"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
      <!-- Cute matching mini heart charm tucked beside the cursor -->
      <path
        class="cursor-heart"
        d="M23.6 22.3C22.9 21.6 21.7 21.6 21 22.3C20.3 23 20.3 24.1 21 24.8L24.5 28.2L28 24.8C28.7 24.1 28.7 23 28 22.3C27.3 21.6 26.1 21.6 25.4 22.3L24.5 23.2L23.6 22.3Z"
        fill="#F2526B"
        stroke="#FFF5F6"
        stroke-width="0.9"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
